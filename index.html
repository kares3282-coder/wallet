<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TonWallet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g'><stop offset='0' stop-color='%234DB8FF'/><stop offset='1' stop-color='%230098EA'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  /* Цветовая палитра по мотивам TON Design System (https://viperfoundation.github.io/tds) */
  --bg: #10161F;
  --bg-card: #1C2532;
  --bg-hover: #232E3E;
  --bg-active: #2A3648;
  --bg-input: #1C2532;
  --text: #FFFFFF;
  --text-dim: #8B95A6;
  --text-soft: #5A6478;
  --border: #232E3E;
  --divider: #1A2230;
  --accent: #4DB8FF;
  --accent-hover: #6EC5FF;
  --accent-soft: #0F2A44;
  --green: #22C55E;
  --red: #EF4444;
  --yellow: #F59E0B;
  --font-ui: 'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', Monaco, monospace;
  --gradient: linear-gradient(135deg, #4DB8FF, #0098EA);
  /* Скругления (Radii) из дизайн-системы TON */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-2xl: 16px;
  /* Тени */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}
html, body { height: 100%; overflow: hidden; font-family: var(--font-ui); background: #000; color: var(--text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.app-container { position: relative; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
.hidden { display: none !important; }

/* CONNECT SCREEN */
#connectScreen { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 480px; margin: 0 auto; padding: 24px; text-align: center; }
.connect-logo { width: 96px; height: 96px; margin-bottom: 24px; border-radius: var(--radius-2xl); background: var(--gradient); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(77, 184, 255, 0.4); }
.connect-logo svg { width: 56px; height: 56px; }
.connect-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.connect-desc { color: var(--text-dim); font-size: 14.5px; margin-bottom: 40px; }
#ton-connect-button { display: flex; justify-content: center; }

/* HEADER */
.app-header { padding: 16px 20px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 10px; }
.wallet-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #fff; }
.header-name { font-size: 15px; font-weight: 600; }
.header-addr { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
.header-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.header-btn:hover { background: var(--bg-hover); }
.header-btn svg { width: 22px; height: 22px; }

/* CONTENT */
.content { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* BALANCE */
.balance-card { padding: 32px 20px 20px; text-align: center; }
.balance-label { color: var(--text-dim); font-size: 13px; margin-bottom: 8px; letter-spacing: 0.3px; }
.balance-value { font-family: var(--font-mono); font-size: 52px; font-weight: 600; letter-spacing: -2px; line-height: 1.1; margin-bottom: 6px; font-feature-settings: 'tnum' 1; }
.balance-value .ton { font-size: 24px; color: var(--text-dim); font-weight: 500; margin-left: 6px; font-family: var(--font-ui); }
.balance-fiat { color: var(--text-dim); font-size: 15px; margin-bottom: 24px; }

.actions-row { display: flex; gap: 8px; padding: 0 20px; }
.action-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 8px; background: var(--bg-card); border: none; border-radius: var(--radius-xl); color: var(--text); cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 500; transition: all 0.15s; }
.action-btn:hover { background: var(--bg-hover); transform: translateY(-1px); }
.action-btn:active { transform: translateY(0); }
.action-btn .action-icon { width: 40px; height: 40px; border-radius: var(--radius-lg); background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.action-btn .action-icon svg { width: 18px; height: 18px; }

/* ASSETS */
.section-title { padding: 24px 20px 12px; font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }
.asset-list { padding: 0 12px; }
.asset-row { display: flex; align-items: center; gap: 12px; padding: 16px 12px; border-bottom: 1px solid var(--divider); cursor: pointer; transition: background 0.15s; }
.asset-row:last-child { border-bottom: none; }
.asset-row:hover { background: var(--bg-card); }
.asset-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; overflow: hidden; }
.asset-icon.ton { background: linear-gradient(135deg, #0098EA, #00A8FF); color: #fff; }
.asset-info { flex: 1; min-width: 0; }
.asset-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.asset-ticker { font-size: 12.5px; color: var(--text-dim); }
.asset-balance { text-align: right; }
.asset-amount { font-size: 15px; font-weight: 600; font-family: var(--font-mono); font-feature-settings: 'tnum' 1; }
.asset-fiat { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; font-family: var(--font-mono); }

/* HISTORY */
.tx-day { padding: 20px 20px 8px; font-size: 12.5px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-lg); cursor: pointer; transition: background 0.15s; margin: 0 12px; }
.tx-row:hover { background: var(--bg-card); }
.tx-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tx-icon.sent { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
.tx-icon.received { background: rgba(34, 197, 94, 0.15); color: #22C55E; }
.tx-icon svg { width: 16px; height: 16px; }
.tx-info { flex: 1; min-width: 0; }
.tx-title { font-size: 14.5px; font-weight: 500; margin-bottom: 2px; }
.tx-time { font-size: 12px; color: var(--text-dim); }
.tx-amount { font-size: 14.5px; font-weight: 600; text-align: right; font-family: var(--font-mono); font-feature-settings: 'tnum' 1; }
.tx-amount.positive { color: var(--green); }
.tx-amount.negative { color: var(--text); }
.tx-fiat { font-size: 12px; color: var(--text-dim); margin-top: 2px; text-align: right; font-family: var(--font-mono); }

/* SETTINGS */
.settings-group { margin: 12px 16px; background: var(--bg-card); border-radius: var(--radius-2xl); overflow: hidden; }
.settings-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--divider); color: var(--text); background: transparent; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; font-size: 14.5px; font-family: inherit; }
.settings-item:last-child { border-bottom: none; }
.settings-item:hover { background: var(--bg-hover); }
.settings-item .icon { width: 34px; height: 34px; border-radius: var(--radius-lg); background: var(--bg-hover); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent); }
.settings-item .icon svg { width: 18px; height: 18px; }
.settings-item .icon.danger { color: var(--red); }
.settings-item .label { flex: 1; }
.settings-item .value { color: var(--text-dim); font-size: 13px; font-family: var(--font-mono); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.settings-item .chev { color: var(--text-soft); }
.settings-item .chev svg { width: 16px; height: 16px; }
.settings-item.danger .label { color: var(--red); }

/* BOTTOM NAV */
.bottom-nav { display: flex; background: rgba(16, 22, 31, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--divider); padding: 6px 0 max(6px, env(safe-area-inset-bottom)) 0; flex-shrink: 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; background: transparent; border: none; cursor: pointer; color: var(--text-soft); font-family: inherit; font-size: 10.5px; transition: color 0.15s; }
.nav-item svg { width: 24px; height: 24px; }
.nav-item.active { color: var(--accent); }

/* MODALS */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 500; display: none; align-items: flex-end; justify-content: center; max-width: 480px; margin: 0 auto; }
.modal-backdrop.show { display: flex; }
.modal { background: var(--bg-card); border-radius: var(--radius-2xl) var(--radius-2xl) 0 0; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px; padding-bottom: max(22px, env(safe-area-inset-bottom)); animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h2 { font-size: 20px; font-weight: 600; margin-bottom: 20px; text-align: center; }
.modal-input { width: 100%; padding: 14px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-xl); color: var(--text); font-family: inherit; font-size: 15px; outline: none; margin-bottom: 12px; }
.modal-input:focus { border-color: var(--accent); }
.modal-input.mono { font-family: var(--font-mono); font-size: 13px; }
.modal-label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn { flex: 1; padding: 14px; border-radius: var(--radius-xl); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
.modal-btn.cancel { background: var(--bg-hover); color: var(--text); }
.modal-btn.confirm { background: var(--gradient); color: #fff; }
.modal-btn.confirm:disabled { opacity: 0.5; cursor: not-allowed; }

.amount-input-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
.amount-input { width: 100%; background: transparent; border: none; color: var(--text); font-family: var(--font-mono); font-size: 42px; font-weight: 700; text-align: center; outline: none; font-feature-settings: 'tnum' 1; }
.amount-input::placeholder { color: var(--text-soft); }
.amount-sub { color: var(--text-dim); font-size: 14px; margin-top: 4px; font-family: var(--font-mono); }
.amount-max { display: inline-block; padding: 4px 12px; background: var(--accent-soft); border-radius: var(--radius-2xl); color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }

.qr-wrap { background: #fff; border-radius: var(--radius-2xl); padding: 20px; margin: 20px auto; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
.qr-wrap img { width: 100%; height: 100%; display: block; }
.addr-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 14px 16px; word-break: break-all; font-family: var(--font-mono); font-size: 12.5px; text-align: center; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }

.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-card); color: var(--text); padding: 12px 22px; border-radius: var(--radius-xl); font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 1000; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- CONNECT SCREEN -->
<div id="connectScreen">
  <div class="connect-logo"><svg viewBox="0 0 100 100" fill="white"><path d="M50 15 C25 15 15 35 15 50 C15 65 25 85 50 85 C75 85 85 65 85 50 C85 35 75 15 50 15 Z M35 40 L48 55 L48 40 L52 40 L52 55 L65 40 L70 43 L55 62 L55 65 L45 65 L45 62 L30 43 Z"/></svg></div>
  <div class="connect-title">Подключите кошелёк</div>
  <div class="connect-desc">Tonkeeper, MyTonWallet, Telegram Wallet и другие</div>
  <div id="ton-connect-button"></div>
</div>

<!-- APP -->
<div class="app-container hidden" id="appContainer">
  <div class="app-header">
    <div class="header-left">
      <div class="wallet-avatar">W</div>
      <div>
        <div class="header-name">Основной</div>
        <div class="header-addr" id="headerAddr">—</div>
      </div>
    </div>
    <button class="header-btn" onclick="scanQR()" title="Сканировать">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="tab-panel active" id="panelMain">
      <div class="balance-card">
        <div class="balance-label">Общий баланс</div>
        <div class="balance-value" id="totalBalance">0.00<span class="ton">TON</span></div>
        <div class="balance-fiat" id="totalFiat">≈ $0.00</div>
      </div>

      <div class="actions-row">
        <button class="action-btn" onclick="openSend()">
          <div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></div>
          Отправить
        </button>
        <button class="action-btn" onclick="openReceive()">
          <div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></div>
          Получить
        </button>
        <button class="action-btn" onclick="toast('Обмен в разработке')">
          <div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
          Обмен
        </button>
        <button class="action-btn" onclick="toast('Покупка в разработке')">
          <div class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
          Купить
        </button>
      </div>

      <div class="section-title">Активы</div>
      <div class="asset-list" id="assetList"></div>
    </div>

    <div class="tab-panel" id="panelHistory">
      <div id="historyList"></div>
    </div>

    <div class="tab-panel" id="panelSettings">
      <div class="settings-group">
        <button class="settings-item" onclick="copyAddress()">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>
          <div class="label">Адрес кошелька</div>
          <div class="value" id="settingsAddr">—</div>
        </button>
        <button class="settings-item" onclick="disconnectWallet()">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
          <div class="label">Отключить кошелёк</div>
          <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>

      </div>

      <div style="text-align:center;color:var(--text-soft);font-size:12px;padding:24px 20px 40px;">
        TonWallet · TonConnect · 2026
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-tab="Main" onclick="switchTab('Main')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Главная</span>
    </button>
    <button class="nav-item" data-tab="History" onclick="switchTab('History')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>История</span>
    </button>
    <button class="nav-item" data-tab="Settings" onclick="switchTab('Settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Ещё</span>

  </div>
</div>

<!-- MODAL SEND -->
<div class="modal-backdrop" id="modalSend" onclick="if(event.target===this)closeModal('modalSend')">

    <h2>Отправить TON</h2>
    <div class="amount-input-wrap">
      <input type="number" class="amount-input" id="sendAmount" placeholder="0" step="0.01" min="0">
      <div class="amount-sub" id="sendFiat">≈ $0.00</div>
      <span class="amount-max" onclick="setMax()">MAX</span>

    <label class="modal-label">Адрес получателя</label>
    <input class="modal-input mono" id="sendAddress" placeholder="UQ...">
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal('modalSend')">Отмена</button>
      <button class="modal-btn confirm" onclick="doSend()" id="sendBtn" disabled>Отправить</button>

</div>

<!-- MODAL RECEIVE -->
<div class="modal-backdrop" id="modalReceive" onclick="if(event.target===this)closeModal('modalReceive')">
  <div class="modal">
    <h2>Получить TON</h2>
    <div class="qr-wrap"><img id="receiveQR" src="" alt=""></div>
    <div class="addr-box" id="receiveAddr">—</div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal('modalReceive')">Закрыть</button>
      <button class="modal-btn confirm" onclick="copyReceiveAddr()">📋 Копировать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════ CONFIG ═══════════════ */
const TONCONNECT_MANIFEST_URL = window.location.origin + '/tonconnect-manifest.json';
const TONAPI_BASE = 'https://tonapi.io/v2';
const PRICE_TON = 5.42;

/* ═══════════════ STATE ═══════════════ */
let tonConnectUI = null;
let userAddress = null;
let userWallet = null;
let realBalance = 0;
let transactions = [];
let currentTab = 'Main';

/* ═══════════════ TONCONNECT INIT ═══════════════ */
async function initTonConnect() {
  tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: TONCONNECT_MANIFEST_URL,
    buttonRootId: 'ton-connect-button',
    actionsConfiguration: {
      returnStrategy: 'back',
      skipRedirectToWallet: /iPhone|iPad|iPod/i.test(navigator.userAgent) ? false : 'never'
    },
    uiPreferences: {
      theme: TON_CONNECT_UI.THEME.DARK,
      borderRadius: 'm',
      colorsSet: {
        [TON_CONNECT_UI.THEME.DARK]: {
          connectButton: { background: '#4DB8FF' },
          accent: '#4DB8FF',
          background: {
            primary: '#10161F',
            secondary: '#1C2532',
            qr: '#FFFFFF',
            tint: '#232E3E'
          },
          text: {
            primary: '#FFFFFF',
            secondary: '#8B95A6'
          },
          icon: {
            primary: '#4DB8FF',
            secondary: '#8B95A6',
            tertiary: '#5A6478'
          },
          constant: { white: '#FFFFFF', black: '#000000' }
        }
      }
    }
  });

  tonConnectUI.onStatusChange(async (wallet) => {
    userWallet = wallet;
    if (wallet) {
      userAddress = wallet.account.address;
      const friendly = toFriendlyAddress(userAddress);
      document.getElementById('headerAddr').textContent = shortAddr(friendly);
      document.getElementById('settingsAddr').textContent = shortAddr(friendly);
      await loadRealBalance(userAddress);
      await loadRealTransactions(userAddress);
      showApp();
    } else {
      userAddress = null;
      showConnectScreen();
    }
  });

  await tonConnectUI.connectionRestored;
}

function toFriendlyAddress(raw) {
  if (raw.startsWith('UQ') || raw.startsWith('EQ') || raw.startsWith('kQ') || raw.startsWith('0Q')) return raw;
  return 'UQ' + raw.slice(-46);
}
function shortAddr(a) { return a.slice(0, 6) + '...' + a.slice(-4); }

/* ═══════════════ API ═══════════════ */
async function loadRealBalance(rawAddr) {
  try {
    const friendly = toFriendlyAddress(rawAddr);
    const res = await axios.get(`${TONAPI_BASE}/accounts/${friendly}`);
    realBalance = (res.data.balance || 0) / 1e9;
    renderBalances();
    renderAssets();
  } catch (e) {
    console.error('TonAPI balance error:', e);
    realBalance = 0;
    renderBalances();
    renderAssets();
  }
}

async function loadRealTransactions(rawAddr) {
  try {
    const friendly = toFriendlyAddress(rawAddr);
    const res = await axios.get(`${TONAPI_BASE}/accounts/${friendly}/events?limit=30`);
    transactions = (res.data.events || []).map(ev => {
      const action = ev.actions?.[0];
      const isOut = action?.simple_preview?.value && action.simple_preview.value.startsWith('-');
      const amount = Math.abs(parseFloat(action?.simple_preview?.value || '0'));
      return {
        id: ev.event_id,
        type: isOut ? 'sent' : 'received',
        asset: 'ton',
        amount: amount,
        usd: amount * PRICE_TON,
        time: ev.timestamp * 1000,
        title: action?.simple_preview?.description || (isOut ? 'Отправлено' : 'Получено')
      };
    });
    renderHistory();
  } catch (e) {
    console.error('TonAPI transactions error:', e);
    transactions = [];
    renderHistory();
  }
}

/* ═══════════════ SEND ═══════════════ */
async function doSend() {
  const amount = parseFloat(document.getElementById('sendAmount').value);
  const toAddress = document.getElementById('sendAddress').value.trim();
  if (!amount || !toAddress) return;
  if (amount > realBalance) { toast('Недостаточно TON'); return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  try {
    const transaction = {
      validUntil: Math.floor(Date.now() / 1000) + 360,
      messages: [{ address: toAddress, amount: String(Math.round(amount * 1e9)) }]
    };
    await tonConnectUI.sendTransaction(transaction);
    toast('Отправлено ✓');
    setTimeout(async () => {
      await loadRealBalance(userAddress);
      await loadRealTransactions(userAddress);
    }, 3000);
    closeModal('modalSend');
  } catch (e) {
    if (e.message?.toLowerCase().includes('cancel') || e.message?.toLowerCase().includes('reject')) toast('Отменено пользователем');
    else toast('Ошибка: ' + (e.message || 'неизвестно'));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Отправить';
  }
}

/* ═══════════════ RENDER ═══════════════ */
function showConnectScreen() {
  document.getElementById('connectScreen').classList.remove('hidden');
  document.getElementById('appContainer').classList.add('hidden');
}
function showApp() {
  document.getElementById('connectScreen').classList.add('hidden');
  document.getElementById('appContainer').classList.remove('hidden');
  renderAll();
}

function renderAll() { renderBalances(); renderAssets(); renderHistory(); }

function renderBalances() {
  document.getElementById('totalBalance').innerHTML = `${realBalance.toFixed(4)}<span class="ton">TON</span>`;
  document.getElementById('totalFiat').textContent = `≈ $${(realBalance * PRICE_TON).toFixed(2)}`;
}

function renderAssets() {
  const list = document.getElementById('assetList');
  list.innerHTML = '';
  if (realBalance <= 0) {
    list.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-dim);">Баланс пуст. Получите TON на адрес из вкладки «Получить».</div>`;
    return;
  }
  const usd = realBalance * PRICE_TON;
  const el = document.createElement('div');
  el.className = 'asset-row';
  el.innerHTML = `
    <div class="asset-icon ton">T</div>
    <div class="asset-info">
      <div class="asset-name">Toncoin</div>
      <div class="asset-ticker">TON</div>
    </div>
    <div class="asset-balance">
      <div class="asset-amount">${realBalance.toFixed(4)}</div>
      <div class="asset-fiat">≈ $${usd.toFixed(2)}</div>
    </div>
  `;
  list.appendChild(el);
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!transactions.length) {
    list.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-dim);">История пуста</div>`;
    return;
  }
  let lastDay = null;
  list.innerHTML = '';
  transactions.slice().sort((a, b) => b.time - a.time).forEach(tx => {
    const day = dayLabel(tx.time);
    if (day !== lastDay) {
      const sep = document.createElement('div');
      sep.className = 'tx-day';
      sep.textContent = day;
      list.appendChild(sep);
      lastDay = day;
    }
    const iconClass = tx.type === 'sent' ? 'sent' : 'received';
    const iconSvg = tx.type === 'sent'
      ? '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>'
      : '<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>';
    const sign = tx.type === 'received' ? '+' : '-';
    const el = document.createElement('div');
    el.className = 'tx-row';
    el.innerHTML = `
      <div class="tx-icon ${iconClass}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${iconSvg}</svg></div>
      <div class="tx-info">
        <div class="tx-title">${escapeHtml(tx.title || (tx.type === 'sent' ? 'Отправлено' : 'Получено'))}</div>
        <div class="tx-time">${formatTime(tx.time)}</div>
      </div>
      <div>
        <div class="tx-amount ${tx.type === 'received' ? 'positive' : 'negative'}">${sign}${tx.amount.toFixed(4)}</div>
        <div class="tx-fiat">$${(tx.usd || 0).toFixed(2)}</div>
      </div>
    `;
    list.appendChild(el);
  });
}

function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const dd = Math.floor((now.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
  if (dd === 0) return 'Сегодня';
  if (dd === 1) return 'Вчера';
  return d.toLocaleDateString('ru', { day: 'numeric', month: 'long' });
}
function formatTime(ts) {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('ru', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}

/* ═══════════════ TABS ═══════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel' + tab).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
}

/* ═══════════════ MODALS ═══════════════ */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

/* ═══════════════ SEND UI ═══════════════ */
function openSend() {
  document.getElementById('sendAmount').value = '';
  document.getElementById('sendAddress').value = '';
  document.getElementById('sendFiat').textContent = '≈ $0.00';
  document.getElementById('sendBtn').disabled = true;
  openModal('modalSend');
}
document.getElementById('sendAmount').addEventListener('input', checkSend);
document.getElementById('sendAddress').addEventListener('input', checkSend);
function checkSend() {
  const amount = parseFloat(document.getElementById('sendAmount').value) || 0;
  const addr = document.getElementById('sendAddress').value.trim();
  document.getElementById('sendFiat').textContent = `≈ $${(amount * PRICE_TON).toFixed(2)}`;
  document.getElementById('sendBtn').disabled = !(amount > 0 && addr && amount <= realBalance);
}
function setMax() {
  document.getElementById('sendAmount').value = Math.max(0, realBalance - 0.01).toFixed(6);
  document.getElementById('sendAmount').dispatchEvent(new Event('input'));
}

/* ═══════════════ RECEIVE ═══════════════ */
function openReceive() {
  if (!userAddress) return;
  const friendly = toFriendlyAddress(userAddress);
  document.getElementById('receiveAddr').textContent = friendly;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(friendly)}`;
  document.getElementById('receiveQR').src = qrUrl;
  openModal('modalReceive');
}
function copyReceiveAddr() {
  const addr = document.getElementById('receiveAddr').textContent;
  navigator.clipboard.writeText(addr).then(() => toast('Адрес скопирован ✓'));
}

/* ═══════════════ SETTINGS ═══════════════ */
function copyAddress() {
  if (!userAddress) return;
  navigator.clipboard.writeText(toFriendlyAddress(userAddress)).then(() => toast('Адрес скопирован ✓'));
}
async function disconnectWallet() {
  if (!confirm('Отключить кошелёк?')) return;
  await tonConnectUI.disconnect();
}

/* ═══════════════ MISC ═══════════════ */
function scanQR() { toast('Сканер QR в разработке'); }
function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
let toastTimer;
function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ═══════════════ INIT ═══════════════ */
(async () => {
  try { await initTonConnect(); }
  catch (e) {
    console.error('TonConnect init error:', e);
    toast('Ошибка TonConnect: ' + e.message);
  }
})();
</script>
