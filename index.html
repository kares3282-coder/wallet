<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tonkeeper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230098EA'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0A0A0A; --bg-card: #161616; --bg-card2: #1C1C1C;
  --bg-hover: #222; --bg-input: #1A1A1A;
  --text: #FFFFFF; --text-dim: #7A7A7A; --text-soft: #555;
  --border: #232323; --divider: #1F1F1F;
  --accent: #0098EA; --accent-2: #4DB8FF;
  --green: #34C759; --red: #FF3B30; --orange: #FF9500;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', monospace;
}
html, body { height: 100%; overflow: hidden; font-family: var(--font); background: #000; color: var(--text); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
.app { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.hidden { display: none !important; }

/* CONNECT */
#connectScreen { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 480px; margin: 0 auto; padding: 24px; text-align: center; }
.connect-logo { width: 88px; height: 88px; margin-bottom: 22px; border-radius: 50%; background: linear-gradient(135deg, #0098EA, #4DB8FF); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(0,152,234,0.35); }
.connect-logo svg { width: 52px; height: 52px; }
.connect-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.connect-desc { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }

/* TOPBAR */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; flex-shrink: 0; }
.topbar-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.topbar-btn svg { width: 22px; height: 22px; }
.wallet-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; background: var(--bg-card); border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text); border: none; font-family: inherit; }
.wallet-pill .dot { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #0098EA, #4DB8FF); display: flex; align-items: center; justify-content: center; }
.wallet-pill .dot svg { width: 12px; height: 12px; color: #fff; }
.wallet-pill .chev { width: 14px; height: 14px; color: var(--text-dim); }
.topbar-right { display: flex; gap: 4px; }

/* BALANCE */
.balance-section { padding: 16px 20px 20px; text-align: center; }
.balance-amount { display: inline-flex; align-items: baseline; gap: 2px; font-size: 58px; font-weight: 700; letter-spacing: -2.5px; line-height: 1; }
.balance-amount .dollar { font-size: 40px; font-weight: 600; color: var(--text); opacity: 0.85; margin-right: 2px; }
.balance-amount .value { font-variant-numeric: tabular-nums; }
.balance-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 30px; border-radius: 6px; border: 1.5px solid var(--text-dim); color: var(--text-dim); margin-left: 6px; }
.balance-badge svg { width: 14px; height: 14px; }
.balance-addr { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--text-dim); font-size: 14px; font-family: var(--mono); cursor: pointer; }
.balance-addr svg { width: 16px; height: 16px; }

/* ACTIONS */
.actions { display: flex; justify-content: space-around; padding: 8px 12px 20px; }
.action { display: flex; flex-direction: column; align-items: center; gap: 8px; background: transparent; border: none; color: var(--text); cursor: pointer; font-family: inherit; font-size: 12.5px; }
.action-circle { width: 52px; height: 52px; border-radius: 50%; background: var(--bg-card); display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.action:hover .action-circle { background: var(--bg-hover); }
.action-circle svg { width: 22px; height: 22px; color: var(--text); }

/* CONTENT */
.content { flex: 1; overflow-y: auto; padding-bottom: 12px; }
.content::-webkit-scrollbar { width: 0; }

/* PROMO */
.promo { margin: 0 12px 12px; background: linear-gradient(110deg, #1A1A1A 0%, #1F1F1F 100%); border-radius: 18px; padding: 16px 16px 16px 18px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; cursor: pointer; min-height: 80px; }
.promo-text { flex: 1; z-index: 1; }
.promo-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.promo-sub { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.promo-sub svg { width: 14px; height: 14px; }
.promo-close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.06); border: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dim); z-index: 2; }
.promo-close svg { width: 12px; height: 12px; }
.promo-img { position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 90px; height: 90px; opacity: 0.9; }

/* RAFFLE */
.raffle { margin: 0 12px 20px; background: var(--bg-card); border-radius: 18px; padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.raffle-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #0098EA, #4DB8FF); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.raffle-icon svg { width: 22px; height: 22px; color: #fff; }
.raffle-title { flex: 1; font-size: 15px; font-weight: 600; }
.raffle-chev { color: var(--text-dim); }
.raffle-chev svg { width: 18px; height: 18px; }

/* SECTION HEAD */
.section-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 12px; }
.section-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.section-title svg { width: 18px; height: 18px; color: var(--text-dim); }
.section-manage { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-dim); cursor: pointer; background: transparent; border: none; font-family: inherit; padding: 4px 0; }
.section-manage:hover { color: var(--text); }
.section-manage svg { width: 16px; height: 16px; }

/* TOKENS */
.tokens { padding: 0 8px; }
.token { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 16px; cursor: pointer; transition: background 0.15s; }
.token:hover { background: var(--bg-card); }
.token-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; overflow: visible; }
.token-icon > svg { width: 48px; height: 48px; border-radius: 50%; }
.token-icon .sub-badge { position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%; background: #000; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
.token-icon .sub-badge svg { width: 14px; height: 14px; border-radius: 0; }
.token-info { flex: 1; min-width: 0; }
.token-name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.token-name { font-size: 16px; font-weight: 600; }
.token-verified { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.token-verified svg { width: 10px; height: 10px; color: #fff; }
.token-badge { padding: 2px 7px; background: rgba(52,199,89,0.15); color: var(--green); border-radius: 6px; font-size: 11px; font-weight: 600; }
.token-badge.gray { background: rgba(255,255,255,0.08); color: var(--text-dim); }
.token-price { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; font-family: var(--mono); }
.token-price .change { color: var(--red); }
.token-price .change.up { color: var(--green); }
.token-balance { text-align: right; flex-shrink: 0; }
.token-amount { font-size: 16px; font-weight: 600; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.token-fiat { font-size: 13px; color: var(--text-dim); margin-top: 3px; font-family: var(--mono); }

/* BOTTOM NAV */
.bottom-nav { display: flex; background: var(--bg); border-top: 1px solid var(--divider); padding: 8px 0 max(8px, env(safe-area-inset-bottom)) 0; flex-shrink: 0; }
.nav { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; background: transparent; border: none; cursor: pointer; color: var(--text-soft); font-family: inherit; font-size: 11px; transition: color 0.15s; }
.nav svg { width: 24px; height: 24px; }
.nav.active { color: var(--accent-2); }

/* MANAGE SCREEN */
.manage-screen { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none; flex-direction: column; max-width: 480px; margin: 0 auto; }
.manage-screen.show { display: flex; }
.manage-header { display: flex; align-items: center; padding: 12px 16px; gap: 12px; flex-shrink: 0; border-bottom: 1px solid var(--divider); }
.manage-back { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.manage-back svg { width: 22px; height: 22px; }
.manage-title { flex: 1; font-size: 18px; font-weight: 600; }
.manage-sub { font-size: 12px; color: var(--text-dim); }
.manage-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.manage-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
.manage-row .token-icon { width: 44px; height: 44px; }
.manage-row .token-icon > svg { width: 44px; height: 44px; }
.manage-info { flex: 1; min-width: 0; }
.manage-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.manage-network { font-size: 12.5px; color: var(--text-dim); }
.toggle { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: #2a2a2a; border-radius: 14px; cursor: pointer; transition: 0.2s; }
.toggle-slider::before { content: ""; position: absolute; width: 24px; height: 24px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.2s; }
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }
.manage-footer { padding: 12px 20px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--divider); }
.manage-btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 14px; color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }

/* MODALS */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; display: none; align-items: flex-end; justify-content: center; max-width: 480px; margin: 0 auto; }
.modal-backdrop.show { display: flex; }
.modal { background: var(--bg-card); border-radius: 24px 24px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; padding: 22px; padding-bottom: max(22px, env(safe-area-inset-bottom)); animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h2 { font-size: 20px; font-weight: 600; margin-bottom: 18px; text-align: center; }
.modal-input { width: 100%; padding: 14px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; margin-bottom: 12px; }
.modal-input:focus { border-color: var(--accent); }
.modal-input.mono { font-family: var(--mono); font-size: 13px; }
.modal-label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn { flex: 1; padding: 14px; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
.modal-btn.cancel { background: var(--bg-hover); color: var(--text); }
.modal-btn.confirm { background: var(--accent); color: #fff; }
.modal-btn.confirm:disabled { opacity: 0.4; cursor: not-allowed; }

.amount-wrap { text-align: center; margin-bottom: 20px; }
.amount-input { width: 100%; background: transparent; border: none; color: var(--text); font-family: var(--mono); font-size: 44px; font-weight: 700; text-align: center; outline: none; font-variant-numeric: tabular-nums; }
.amount-input::placeholder { color: var(--text-soft); }
.amount-sub { color: var(--text-dim); font-size: 14px; margin-top: 4px; font-family: var(--mono); }
.amount-max { display: inline-block; padding: 5px 12px; background: rgba(0,152,234,0.15); border-radius: 20px; color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }

.qr-wrap { background: #fff; border-radius: 20px; padding: 16px; margin: 16px auto; width: 230px; height: 230px; display: flex; align-items: center; justify-content: center; }
.qr-wrap img { width: 100%; height: 100%; display: block; }
.addr-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; word-break: break-all; font-family: var(--mono); font-size: 12.5px; text-align: center; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }

/* SCANNER */
.scan-modal { position: fixed; inset: 0; z-index: 600; background: #000; display: none; flex-direction: column; max-width: 480px; margin: 0 auto; }
.scan-modal.show { display: flex; }
.scan-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; flex-shrink: 0; background: rgba(0,0,0,0.6); position: relative; z-index: 10; }
.scan-header h2 { font-size: 17px; font-weight: 600; }
.scan-close { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.scan-close svg { width: 20px; height: 20px; }
.scan-torch { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.scan-torch svg { width: 20px; height: 20px; }
.scan-torch.on { background: var(--accent); }
.scan-viewport { flex: 1; position: relative; overflow: hidden; }
#qr-reader { width: 100%; height: 100%; border: none; }
#qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
.scan-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.scan-frame { width: 260px; height: 260px; position: relative; }
.scan-frame::before, .scan-frame::after,
.scan-frame .corner-tl, .scan-frame .corner-tr,
.scan-frame .corner-bl, .scan-frame .corner-br { content: ""; position: absolute; width: 40px; height: 40px; border-color: #0098EA; }
.scan-frame::before { top: 0; left: 0; border-top: 4px solid #0098EA; border-left: 4px solid #0098EA; border-top-left-radius: 12px; }
.scan-frame::after { top: 0; right: 0; border-top: 4px solid #0098EA; border-right: 4px solid #0098EA; border-top-right-radius: 12px; }
.scan-frame .corner-bl { bottom: 0; left: 0; border-bottom: 4px solid #0098EA; border-left: 4px solid #0098EA; border-bottom-left-radius: 12px; }
.scan-frame .corner-br { bottom: 0; right: 0; border-bottom: 4px solid #0098EA; border-right: 4px solid #0098EA; border-bottom-right-radius: 12px; }
.scan-laser { position: absolute; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, #0098EA, transparent); box-shadow: 0 0 12px #0098EA; top: 0; animation: scanMove 2.2s ease-in-out infinite; }
@keyframes scanMove { 0%,100% { top: 5%; } 50% { top: 95%; } }
.scan-hint { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
.scan-controls { display: flex; justify-content: center; align-items: center; gap: 30px; padding: 20px 16px max(20px, env(safe-area-inset-bottom)); background: #000; flex-shrink: 0; }
.scan-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; background: transparent; border: none; color: #fff; cursor: pointer; font-family: inherit; font-size: 12px; }
.scan-btn-circle { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
.scan-btn-circle svg { width: 22px; height: 22px; }
#qr-file-input { display: none; }
.scan-viewport.placeholder { display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px; font-size: 14px; }

.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-card2); color: var(--text); padding: 12px 22px; border-radius: 14px; font-size: 13.5px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 1000; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- CONNECT SCREEN -->
<div id="connectScreen">
  <div class="connect-logo"><svg viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
  <div class="connect-title">Подключите кошелёк</div>
  <div class="connect-desc">Tonkeeper, MyTonWallet, Telegram Wallet</div>
  <div id="ton-connect-button"></div>
</div>

<!-- APP -->
<div class="app hidden" id="appContainer">

  <div class="topbar">
    <button class="topbar-btn" onclick="openScanner()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
    </button>
    <button class="wallet-pill" onclick="toast('Переключение кошельков')">
      <span class="dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg></span>
      <span>Кошелёк</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="topbar-right">
      <button class="topbar-btn" onclick="toast('История')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="topbar-btn" onclick="toast('Настройки')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="balance-section">
    <div class="balance-amount">
      <span class="dollar">$</span>
      <span class="value" id="balanceValue">0</span>
      <span class="balance-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
    </div>
    <div class="balance-addr" onclick="copyAddress()">
      <span id="balanceAddr">UQDD...XyoU</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 15 12 20 17 15"/><polyline points="7 9 12 4 17 9"/></svg>
    </div>
  </div>

  <div class="actions">
    <button class="action" onclick="openSend()">
      <div class="action-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></div>
      Отправить
    </button>
    <button class="action" onclick="openReceive()">

<script>
const TONCONNECT_MANIFEST_URL = window.location.origin + '/tonconnect-manifest.json';
const TONAPI_BASE = 'https://tonapi.io/v2';
const PRICE_TON = 5.42;
const STORAGE_KEY = 'tonkeeper_hidden_tokens';

let tonConnectUI = null;
let userAddress = null;
let realBalance = 0;
let hiddenTokens = new Set();
let html5QrCode = null;
let currentTorchState = false;
let scannerActive = false;

/* ═══ СПИСОК ТОКЕНОВ ═══ */
const TOKENS = [
  { id: 'ton',     name: 'TON',    network: null,         price: 5.42,     change: 0,     icon: 'ton',   verified: true, isNative: true },
  { id: 'usdt_trc',name: 'USDT',   network: 'TRC20',      price: 1.00,     change: 0,     icon: 'usdt',  verified: true, subBadge: 'tron' },
  { id: 'usdt_ton',name: 'USDT',   network: 'TON',        price: 1.00,     change: 0,     icon: 'usdt',  verified: true, subBadge: 'ton' },
  { id: 'usdt_erc',name: 'USDT',   network: 'ERC20',      price: 1.00,     change: 0,     icon: 'usdt',  verified: true, subBadge: 'eth' },
  { id: 'usdc',    name: 'USDC',   network: 'ARBITRUM',   price: 1.00,     change: 0,     icon: 'usdc',  verified: true, subBadge: 'arb' },
  { id: 'eth',     name: 'ETH',    network: null,         price: 2522.26,  change: -1.53, icon: 'eth',   verified: true },
  { id: 'eth_base',name: 'ETH',    network: 'BASE',       price: 2522.26,  change: -1.53, icon: 'eth',   verified: true, subBadge: 'base' },
  { id: 'btc',     name: 'BTC',    network: null,         price: 83446.30, change: -0.51, icon: 'btc',   verified: true },
  { id: 'bnb',     name: 'BNB',    network: null,         price: 744.98,   change: -1.06, icon: 'bnb',   verified: true },
  { id: 'gram',    name: 'GRAM',   network: null,         price: 1.39,     change: -4.34, icon: 'gram',  verified: true, badge: '12,84% APY', badgeGreen: true }
];

const ICONS = {
  ton:   '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#0098EA"/><path d="M24 12 L14 24 L24 30 L34 24 Z M24 32 L17 27 L24 36 L31 27 Z" fill="white"/></svg>',
  gram:  '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#0098EA"/><path d="M24 12 L14 24 L24 30 L34 24 Z M24 32 L17 27 L24 36 L31 27 Z" fill="white"/></svg>',
  eth:   '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#627EEA"/><path d="M24 8 L16 24 L24 28 L32 24 Z" fill="white" opacity="0.85"/><path d="M24 30 L16 25 L24 40 L32 25 Z" fill="white"/></svg>',
  btc:   '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#F7931A"/><text x="24" y="32" text-anchor="middle" fill="white" font-size="26" font-weight="700" font-family="Arial">₿</text></svg>',
  bnb:   '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#F3BA2F"/><path d="M24 12 L20 16 L24 20 L28 16 Z M16 20 L20 24 L16 28 L12 24 Z M32 20 L36 24 L32 28 L28 24 Z M24 28 L20 32 L24 36 L28 32 Z M24 22 L26 24 L24 26 L22 24 Z" fill="white"/></svg>',
  usdc:  '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#2775CA"/><text x="24" y="32" text-anchor="middle" fill="white" font-size="24" font-weight="700" font-family="Arial">$</text></svg>',
  usdt:  '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#26A17B"/><text x="24" y="32" text-anchor="middle" fill="white" font-size="24" font-weight="700" font-family="Arial">₮</text></svg>',
  base:  '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#0052FF"/><circle cx="10" cy="10" r="6" fill="white"/></svg>',
  arb:   '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#2D374B"/><path d="M10 4 L6 12 L14 12 Z" fill="white"/></svg>',
  tron:  '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#EF0027"/><path d="M4 6 L16 9 L11 15 Z" fill="white"/></svg>'
};

/* ═══ STORAGE ═══ */
function loadHidden() {
  try {
    const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    hiddenTokens = new Set(arr);
  } catch { hiddenTokens = new Set(); }
}
function saveHidden() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...hiddenTokens]));
}

/* ═══ TONCONNECT ═══ */
async function initTonConnect() {
  tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: TONCONNECT_MANIFEST_URL,
    buttonRootId: 'ton-connect-button',
    actionsConfiguration: {
      returnStrategy: 'back',
      skipRedirectToWallet: /iPhone|iPad|iPod/i.test(navigator.userAgent) ? false : 'never'
    },
    uiPreferences: {
      theme: TON_CONNECT_UI.THEME.DARK,
      borderRadius: 'm',
      colorsSet: {
        [TON_CONNECT_UI.THEME.DARK]: {
          connectButton: { background: '#0098EA' },
          accent: '#0098EA',
          background: { primary: '#0A0A0A', secondary: '#161616', qr: '#FFFFFF', tint: '#232323' },
          text: { primary: '#FFFFFF', secondary: '#7A7A7A' },
          icon: { primary: '#0098EA', secondary: '#7A7A7A', tertiary: '#555' },
          constant: { white: '#FFFFFF', black: '#000000' }
        }
      }
    }
  });

  tonConnectUI.onStatusChange(async (wallet) => {
    if (wallet) {
      userAddress = wallet.account.address;
      const friendly = toFriendlyAddress(userAddress);
      document.getElementById('balanceAddr').textContent = shortAddr(friendly);
      await loadRealBalance(userAddress);
      showApp();
    } else {
      userAddress = null;
      showConnectScreen();
    }
  });

  await tonConnectUI.connectionRestored;
}

function toFriendlyAddress(raw) {
  if (raw.startsWith('UQ') || raw.startsWith('EQ') || raw.startsWith('kQ') || raw.startsWith('0Q')) return raw;
  return 'UQ' + raw.slice(-46);
}
function shortAddr(a) { return a.slice(0, 6) + '...' + a.slice(-4); }

/* ═══ API ═══ */
async function loadRealBalance(rawAddr) {
  try {
    const friendly = toFriendlyAddress(rawAddr);
    const res = await axios.get(`${TONAPI_BASE}/accounts/${friendly}`);
    realBalance = (res.data.balance || 0) / 1e9;
  } catch (e) {
    console.error('TonAPI error:', e);
    realBalance = 0;
  }
  updateBalance();
  renderTokens();
}

function getTokenAmount(t) {
  if (t.isNative) return realBalance;
  return 0;
}

function getTotalUSD() {
  let total = 0;
  TOKENS.forEach(t => {
    if (hiddenTokens.has(t.id)) return;
    total += getTokenAmount(t) * t.price;
  });
  return total;
}

function updateBalance() {
  const usdTotal = getTotalUSD();
  document.getElementById('balanceValue').textContent = usdTotal.toFixed(2).replace('.00', '');
}

/* ═══ RENDER TOKENS ═══ */
function renderTokens() {
  const list = document.getElementById('tokensList');
  list.innerHTML = '';
  const visible = TOKENS.filter(t => !hiddenTokens.has(t.id));
  if (!visible.length) {
    list.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-dim);">Все токены скрыты. Нажмите «Управление», чтобы вернуть.</div>`;
    return;
  }
  visible.forEach(t => {
    const amount = getTokenAmount(t);
    const usd = amount * t.price;
    const el = document.createElement('div');
    el.className = 'token';
    el.onclick = () => toast(t.name + (t.network ? ' · ' + t.network : '') + ' — скоро');

    const changeStr = `${t.change.toFixed(2).replace('.', ',')}%`;
    const changeClass = t.change > 0 ? 'change up' : 'change';

    let badgeHtml = '';
    if (t.badgeGreen && t.badge) badgeHtml = `<span class="token-badge">${t.badge}</span>`;
    else if (t.network) badgeHtml = `<span class="token-badge gray">${t.network}</span>`;

    let subBadge = '';
    if (t.subBadge && ICONS[t.subBadge]) subBadge = `<span class="sub-badge">${ICONS[t.subBadge]}</span>`;

    el.innerHTML = `
      <div class="token-icon">${ICONS[t.icon] || ICONS.ton}${subBadge}</div>
      <div class="token-info">
        <div class="token-name-row">
          <span class="token-name">${t.name}</span>
          ${t.verified ? '<span class="token-verified"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' : ''}
          ${badgeHtml}
        </div>
        <div class="token-price">
          <span>$${t.price.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
          <span class="${changeClass}">${changeStr}</span>
        </div>
      </div>
      <div class="token-balance">
        <div class="token-amount">${amount.toFixed(0)}</div>
        <div class="token-fiat">$${usd.toFixed(0)}</div>
      </div>
    `;
    list.appendChild(el);
  });
}

/* ═══ MANAGE ═══ */
function openManage() {
  const list = document.getElementById('manageList');
  list.innerHTML = '';
  TOKENS.forEach(t => {
    const row = document.createElement('div');
    row.className = 'manage-row';
    const checked = !hiddenTokens.has(t.id);
    let subBadge = '';
    if (t.subBadge && ICONS[t.subBadge]) subBadge = `<span class="sub-badge">${ICONS[t.subBadge]}</span>`;
    row.innerHTML = `
      <div class="token-icon">${ICONS[t.icon] || ICONS.ton}${subBadge}</div>
      <div class="manage-info">
        <div class="manage-name">${t.name}</div>
        <div class="manage-network">${t.network || (t.isNative ? 'TON' : 'Native')}</div>
      </div>
      <label class="toggle">
        <input type="checkbox" data-token="${t.id}" ${checked ? 'checked' : ''}>
        <span class="toggle-slider"></span>
      </label>
    `;
    list.appendChild(row);
  });
  document.getElementById('manageScreen').classList.add('show');
}
function closeManage() {
  document.getElementById('manageScreen').classList.remove('show');
}
function saveManage() {
  const boxes = document.querySelectorAll('#manageList input[type="checkbox"]');
  hiddenTokens = new Set();
  boxes.forEach(b => {
    if (!b.checked) hiddenTokens.add(b.dataset.token);
  });
  saveHidden();
  updateBalance();
  renderTokens();
  closeManage();
  toast('Сохранено ✓');
}

/* ═══ SEND ═══ */
function openSend(prefillAddress) {
  document.getElementById('sendAmount').value = '';
  document.getElementById('sendAddress').value = prefillAddress || '';
  document.getElementById('sendFiat').textContent = '≈ $0.00';
  document.getElementById('sendBtn').disabled = true;
  checkSend();
  openModal('modalSend');
}
document.getElementById('sendAmount').addEventListener('input', checkSend);
document.getElementById('sendAddress').addEventListener('input', checkSend);
function checkSend() {
  const amount = parseFloat(document.getElementById('sendAmount').value) || 0;
  const addr = document.getElementById('sendAddress').value.trim();
  document.getElementById('sendFiat').textContent = `≈ $${(amount * PRICE_TON).toFixed(2)}`;
  document.getElementById('sendBtn').disabled = !(amount > 0 && addr && amount <= realBalance);
}
function setMax() {
  document.getElementById('sendAmount').value = Math.max(0, realBalance - 0.01).toFixed(6);
  document.getElementById('sendAmount').dispatchEvent(new Event('input'));
}
async function doSend() {
  const amount = parseFloat(document.getElementById('sendAmount').value);
  const toAddress = document.getElementById('sendAddress').value.trim();
  if (!amount || !toAddress) return;
  if (amount > realBalance) { toast('Недостаточно TON'); return; }
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = 'Отправка...';
  try {
    const tx = {
      validUntil: Math.floor(Date.now() / 1000) + 360,
      messages: [{ address: toAddress, amount: String(Math.round(amount * 1e9)) }]
    };
    await tonConnectUI.sendTransaction(tx);
    toast('Отправлено ✓');
    setTimeout(() => loadRealBalance(userAddress), 3000);
    closeModal('modalSend');
  } catch (e) {
    if (e.message?.toLowerCase().includes('cancel') || e.message?.toLowerCase().includes('reject')) toast('Отменено');
    else toast('Ошибка: ' + (e.message || 'неизвестно'));
  } finally {
    btn.disabled = false; btn.textContent = 'Отправить';
  }
}

/* ═══ RECEIVE ═══ */
function openReceive() {
  if (!userAddress) return;
  const friendly = toFriendlyAddress(userAddress);
  document.getElementById('receiveAddr').textContent = friendly;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=230x230&bgcolor=ffffff&color=000000&data=${encodeURIComponent(friendly)}`;
  document.getElementById('receiveQR').src = qrUrl;
  openModal('modalReceive');
}
function copyReceiveAddr() {
  const addr = document.getElementById('receiveAddr').textContent;
  navigator.clipboard.writeText(addr).then(() => toast('Адрес скопирован ✓'));
}
function copyAddress() {
  if (!userAddress) return;
  navigator.clipboard.writeText(toFriendlyAddress(userAddress)).then(() => toast('Адрес скопирован ✓'));
}

/* ═══ QR SCANNER ═══ */
function openScanner() {
  // Закрываем модалку Send если открыта, чтобы не мешала
  closeModal('modalSend');
  document.getElementById('scanModal').classList.add('show');
  startScanner();
}

function closeScanner() {
  document.getElementById('scanModal').classList.remove('show');
  stopScanner();
}

function startScanner() {
  if (scannerActive) return;
  scannerActive = true;
  currentTorchState = false;
  document.getElementById('torchBtn').classList.remove('on');

  html5QrCode = new Html5Qrcode("qr-reader", { 
    verbose: false,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  });

  const config = {
    fps: 15,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      const qrboxSize = Math.floor(minEdge * 0.75);
      return { width: qrboxSize, height: qrboxSize };
    },
    aspectRatio: 1.0,
    disableFlip: false
  };

  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    () => {} // onScanError — игнорируем
  ).catch(err => {
    console.error('Ошибка запуска камеры:', err);
    scannerActive = false;
    toast('Не удалось запустить камеру. Проверьте разрешения и HTTPS.');
  });
}

function stopScanner() {
  if (!scannerActive || !html5QrCode) return;
  scannerActive = false;
  try {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      html5QrCode = null;
    }).catch(() => {
      html5QrCode = null;
    });
  } catch (e) {
    html5QrCode = null;
  }
}

function toggleTorch() {
  if (!html5QrCode || !scannerActive) return;
  currentTorchState = !currentTorchState;
  html5QrCode.applyVideoConstraints({
    advanced: [{ torch: currentTorchState }]
  }).then(() => {
    document.getElementById('torchBtn').classList.toggle('on', currentTorchState);
  }).catch(() => {
    toast('Вспышка недоступна');
    currentTorchState = false;
  });
}

// Главный обработчик отсканированного кода
function onScanSuccess(decodedText, decodedResult) {
  // Вибрация
  if (navigator.vibrate) navigator.vibrate(150);
  
  // Останавливаем сканер, чтобы не было повторных срабатываний
  stopScanner();
  document.getElementById('scanModal').classList.remove('show');

  // Небольшая задержка, чтобы UI успел обновиться
  setTimeout(() => {
    handleScannedCode(decodedText);
  }, 200);
}

function handleScannedCode(text) {
  const clean = text.trim();

  // 1. WalletConnect
  if (clean.startsWith('wc:')) {
    toast('WalletConnect URI обнаружен');
    // Здесь можно передать URI в tonConnectUI
    try {
      tonConnectUI.openModal();
    } catch (e) {
      console.error(e);
    }
    return;
  }

  // 2. TON URI (ton://transfer/...)
  if (clean.startsWith('ton://')) {
    const parsed = parseTonUri(clean);
    if (parsed.address) {
      openSend(parsed.address);
      if (parsed.amount) {
        setTimeout(() => {
          document.getElementById('sendAmount').value = parsed.amount;
          checkSend();
        }, 100);
      }
      toast('TON-адрес распознан');
    } else {
      toast('Не удалось разобрать ton:// ссылку');
    }
    return;
  }

  // 3. TON адрес в raw-формате (0:hex)
  if (/^0:[a-fA-F0-9]{64}$/.test(clean)) {
    openSend(clean);
    toast('TON-адрес распознан');
    return;
  }

  // 4. TON friendly address (EQ/UQ/kQ/0Q + 46 base64)
  if (/^(EQ|UQ|kQ|0Q)[A-Za-z0-9_-]{46}$/.test(clean)) {
    openSend(clean);
    toast('TON-адрес распознан');
    return;
  }

  // 5. Просто строка, похожая на адрес (48 символов base64)
  if (/^[A-Za-z0-9_-]{48}$/.test(clean)) {
    openSend(clean);
    toast('Адрес распознан');
    return;
  }

  // 6. URL — открываем во внешнем браузере (если это не dApp для TonConnect)
  if (clean.startsWith('http://') || clean.startsWith('https://')) {
    toast('Открываю ссылку...');
    setTimeout(() => window.open(clean, '_blank'), 300);
    return;
  }

  // 7. Неизвестный формат
  toast('Неизвестный QR: ' + clean.substring(0, 40));
}

// Парсер ton://transfer/<address>?amount=X&text=...
function parseTonUri(uri) {
  try {
    const withoutScheme = uri.replace('ton://', '');
    const [pathPart, queryPart] = withoutScheme.split('?');
    const path = pathPart.replace('transfer/', '').replace(/\/$/, '');
    const params = new URLSearchParams(queryPart || '');
    const amountNano = params.get('amount');
    const amount = amountNano ? (parseFloat(amountNano) / 1e9).toString() : null;
    return { address: path, amount, text: params.get('text') };
  } catch (e) {
    return { address: null, amount: null };
  }
}

// Сканирование из галереи
function scanFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Временно создаем невидимый инстанс для сканирования файла
  const tempScanner = new Html5Qrcode("qr-reader", { verbose: false });
  
  tempScanner.scanFile(file, true)
    .then(decodedText => {
      if (navigator.vibrate) navigator.vibrate(150);
      closeScanner();
      setTimeout(() => handleScannedCode(decodedText), 200);
    })
    .catch(err => {
      console.error('Ошибка сканирования файла:', err);
      toast('QR-код не найден на изображении');
    })
    .finally(() => {
      event.target.value = '';
    });
}

  document.getElementById('connectScreen').classList.remove('hidden');
  document.getElementById('appContainer').classList.add('hidden');
}
function showApp() {
  document.getElementById('connectScreen').classList.add('hidden');
  document.getElementById('appContainer').classList.remove('hidden');
  updateBalance();
  renderTokens();
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function switchTab(tab, el) {
  document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  if (tab !== 'wallet') toast(tab.charAt(0).toUpperCase() + tab.slice(1) + ' — в разработке');
}
let toastTimer;
function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}
